name: Deploy to GCP

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: clipai-4bb71
  REGION: us-central1
  REPO_NAME: backend-repo
  SERVICE_NAME: clipai-api

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          cd apps/api
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:${{ github.sha }} .
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            GEMINI_MODEL=gemini-3.8-flash
            WHISPER_MODEL=base
            MAX_UPLOAD_MB=2048
          secrets: |
            GOOGLE_API_KEY=GOOGLE_API_KEY:latest
          flags: |
            --memory=8Gi
            --cpu=8
            --allow-unauthenticated
            --no-cpu-throttling

  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get Cloud Run URL
        id: get-api-url
        run: |
          API_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "API_URL=$API_URL" >> $GITHUB_ENV

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyBCCJn7jWIe10_lE89yE1dekJV_ZMME0Qc"
          VITE_FIREBASE_AUTH_DOMAIN: "clipai-4bb71.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "clipai-4bb71"
          VITE_FIREBASE_STORAGE_BUCKET: "clipai-4bb71.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "317418402807"
          VITE_FIREBASE_APP_ID: "1:317418402807:web:b8165ac3403a7e5c0db4f2"
          VITE_FIREBASE_MEASUREMENT_ID: "G-MVG49RQSMQ"
        run: |
          cd apps/web
          npm install
          VITE_API_URL=${{ env.API_URL }} npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: clipai-4bb71
          channelId: live
